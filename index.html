<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning Base</title>

    <!-- FAVICON MỚI – Sách Mở + Ngôi Sao, Gradient Tím-Hồng, thêm ?v=2 để phá cache -->
	<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%238b5cf6'/%3E%3Cstop offset='100%25' stop-color='%23f472b6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%23ffffff' stroke-width='5'/%3E%3Ccircle cx='50' cy='50' r='42' fill='none' stroke='%23ffffff' stroke-width='3' stroke-dasharray='8 6'/%3E%3Cline x1='50' y1='8' x2='50' y2='20' stroke='%23ffffff' stroke-width='4' stroke-linecap='round'/%3E%3Cline x1='50' y1='80' x2='50' y2='92' stroke='%23ffffff' stroke-width='4' stroke-linecap='round'/%3E%3Cline x1='8' y1='50' x2='20' y2='50' stroke='%23ffffff' stroke-width='4' stroke-linecap='round'/%3E%3Cline x1='80' y1='50' x2='92' y2='50' stroke='%23ffffff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* ... toàn bộ CSS giữ nguyên ... */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --base: #0e0a1e;
            --glass-bg: rgba(37, 31, 69, 0.55);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
            --glass-blur: 18px;
            --vio: #8b5cf6;
            --vio-l: #c4b5fd;
            --pink: #f472b6;
            --pink-l: #fbcfe8;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --faint: #475569;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--base);
            color: var(--text);
            display: flex;
            flex-direction: row;
            background-image: radial-gradient(circle at 30% 40%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 70% 80%, rgba(244, 114, 182, 0.06) 0%, transparent 50%);
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.4);
            border-radius: 99px;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .glass-light {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
        }

        #sidebar {
            width: 272px;
            min-width: 272px;
            margin: 12px 0 12px 12px;
            height: calc(100vh - 24px);
            border-radius: 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: var(--glass-shadow);
            transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                min-width 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.25s ease,
                margin 0.35s ease;
            z-index: 40;
            position: relative;
        }

        body.sidebar-collapsed #sidebar {
            width: 0 !important;
            min-width: 0 !important;
            margin-left: 0 !important;
            opacity: 0;
            pointer-events: none;
        }

        @media (max-width: 767px) {
            #sidebar {
                position: fixed;
                left: 12px;
                top: 12px;
                height: calc(100vh - 24px);
                transform: translateX(calc(-100% - 24px));
                transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
                z-index: 50;
            }
            body.sidebar-open #sidebar {
                transform: translateX(0);
                opacity: 1;
            }
            body.sidebar-open #sidebarBackdrop {
                opacity: 1 !important;
                pointer-events: auto !important;
            }
        }

        .sidebar-header {
            padding: 20px 18px 14px;
            background: linear-gradient(160deg, rgba(139, 92, 246, 0.15) 0%, rgba(139, 92, 246, 0.02) 60%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        #mainArea {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            padding: 12px 12px 12px 8px;
            gap: 10px;
            height: 100vh;
            overflow: hidden;
        }

        #headerCard {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            height: 52px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            gap: 10px;
            box-shadow: var(--glass-shadow);
        }

        #iframeWrapper {
            flex: 1;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            display: none;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
        }
        #iframeWrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        #welcomeState {
            flex: 1;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
            position: relative;
            box-shadow: var(--glass-shadow);
        }

        .glow-vio {
            position: absolute;
            width: 380px;
            height: 380px;
            border-radius: 9999px;
            background: radial-gradient(ellipse, rgba(139, 92, 246, 0.15) 0%, transparent 65%);
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .glow-pink {
            position: absolute;
            width: 250px;
            height: 250px;
            border-radius: 9999px;
            background: radial-gradient(ellipse, rgba(244, 114, 182, 0.10) 0%, transparent 65%);
            top: 60%;
            left: 65%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .welcome-logo {
            width: 68px;
            height: 68px;
            border-radius: 22px;
            background: rgba(139, 92, 246, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(139, 92, 246, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(139, 92, 246, 0.15);
            margin-bottom: 24px;
        }

        .gdiv {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.5), rgba(244, 114, 182, 0.4), transparent);
            margin: 24px 0;
            width: 100%;
            max-width: 280px;
        }

        .stat-pill {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 10px 22px;
            border-radius: 16px;
            background: rgba(139, 92, 246, 0.08);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(139, 92, 246, 0.15);
        }

        .app-item {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 14px;
            border: 1px solid transparent;
            cursor: grab;
            text-align: left;
            color: var(--muted);
            transition: all 0.18s ease;
            position: relative;
            background: transparent;
            user-select: none;
        }
        .app-item:hover {
            background: rgba(139, 92, 246, 0.10);
            border-color: rgba(139, 92, 246, 0.2);
            color: var(--text);
            backdrop-filter: blur(4px);
        }
        .app-item.active {
            background: rgba(139, 92, 246, 0.18);
            backdrop-filter: blur(8px);
            border-color: rgba(139, 92, 246, 0.3);
            color: var(--text);
            box-shadow: 0 2px 16px rgba(139, 92, 246, 0.12);
        }
        .app-item:active {
            cursor: grabbing;
        }
        .app-item.drag-over {
            border-color: rgba(139, 92, 246, 0.6);
            background: rgba(139, 92, 246, 0.15);
            transform: scale(1.01);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.15);
        }
        .app-item.dragging {
            opacity: 0.4;
            transform: scale(0.96);
        }
        .app-actions {
            opacity: 0;
            transition: opacity 0.15s ease;
            display: flex;
            gap: 2px;
        }
        .app-item:hover .app-actions {
            opacity: 1;
        }
        /* khi đang kéo, ẩn nút để tránh va chạm */
        .app-item.dragging .app-actions {
            opacity: 0 !important;
            pointer-events: none;
        }

        .app-item .drag-handle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--faint);
            opacity: 0.3;
            transition: opacity 0.2s;
            margin-right: 4px;
            flex-shrink: 0;
        }
        .app-item:hover .drag-handle {
            opacity: 0.7;
        }
        .app-item:active .drag-handle {
            opacity: 1;
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 7px;
            border-radius: 11px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: var(--muted);
            cursor: pointer;
            transition: all 0.18s ease;
            backdrop-filter: blur(4px);
        }
        .icon-btn:hover {
            background: rgba(139, 92, 246, 0.14);
            border-color: rgba(139, 92, 246, 0.3);
            color: var(--vio-l);
        }
        .icon-btn.danger:hover {
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.25);
            color: #f87171;
        }

        .bc-home {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 12px 4px 8px;
            border-radius: 9999px;
            border: 1px solid transparent;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.03em;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.18s ease;
            background: rgba(255, 255, 255, 0.02);
        }
        .bc-home:hover {
            background: rgba(139, 92, 246, 0.10);
            border-color: rgba(139, 92, 246, 0.2);
            color: var(--vio-l);
        }

        .app-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px 3px 7px;
            border-radius: 9999px;
            background: rgba(139, 92, 246, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(139, 92, 246, 0.2);
            max-width: 220px;
            overflow: hidden;
        }

        .ver-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 12px;
            border-radius: 9999px;
            background: rgba(139, 92, 246, 0.12);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(139, 92, 246, 0.15);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.1em;
            color: var(--vio-l);
            text-transform: uppercase;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 11px;
            border-radius: 9999px;
            background: rgba(16, 185, 129, 0.08);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(16, 185, 129, 0.2);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: #34d399;
        }
        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 9999px;
            background: #10b981;
            position: relative;
            display: inline-flex;
        }
        .live-dot::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            background: #10b981;
            opacity: 0.7;
            animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
        @keyframes ping {
            75%,
            100% {
                transform: scale(2.2);
                opacity: 0;
            }
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .add-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 11px 16px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(244, 114, 182, 0.2));
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.2);
        }
        .add-btn:hover {
            opacity: 0.88;
            transform: translateY(-1px);
            box-shadow: 0 6px 28px rgba(139, 92, 246, 0.35);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .add-btn:active {
            transform: scale(0.98);
        }

        .btn-pri {
            padding: 8px 20px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.4), rgba(139, 92, 246, 0.2));
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 12px rgba(139, 92, 246, 0.2);
        }
        .btn-pri:hover {
            opacity: 0.88;
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-sec {
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
            transition: all 0.18s;
        }
        .btn-sec:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .btn-danger {
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            background: rgba(220, 38, 38, 0.25);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(248, 113, 113, 0.15);
            cursor: pointer;
            transition: all 0.18s;
            box-shadow: 0 2px 12px rgba(220, 38, 38, 0.15);
        }
        .btn-danger:hover {
            opacity: 0.85;
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(220, 38, 38, 0.25);
            border-color: rgba(248, 113, 113, 0.3);
        }

        .modal-card {
            background: rgba(37, 31, 69, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.03);
        }

        .modal-input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            font-size: 13px;
            color: var(--text);
            outline: none;
            transition: border-color 0.18s, box-shadow 0.18s;
            font-family: inherit;
        }
        .modal-input:focus {
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.08);
        }
        .modal-input::placeholder {
            color: #475569;
        }

        .mlabel {
            display: block;
            margin-bottom: 7px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--faint);
        }

        .slabel {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--faint);
            padding: 0 4px;
        }

        .toast {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 16px;
            border-radius: 16px;
            background: rgba(37, 31, 69, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        #sidebarBackdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 45;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        @media (max-width: 767px) {
            #sidebar {
                border-radius: 20px;
                left: 8px;
                top: 8px;
                height: calc(100vh - 16px);
            }
            #mainArea {
                padding: 8px;
            }
            #headerCard {
                border-radius: 16px;
                height: 48px;
                padding: 0 10px;
            }
            #welcomeState {
                border-radius: 16px;
                padding: 24px;
            }
            #iframeWrapper {
                border-radius: 16px;
            }
        }

        /* ═══ ĐỒNG HỒ MỚI – GIỮA, SÁNG HƠN ═══ */
        .clock-center {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 16px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.15);
            font-size: 14px;
            font-weight: 800;
            color: #f0f0ff;
            letter-spacing: 0.05em;
            transition: all 0.2s;
        }
        .clock-center i {
            color: #c4b5fd;
        }
        .clock-center:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(139, 92, 246, 0.3);
            box-shadow: 0 0 28px rgba(139, 92, 246, 0.25);
        }
        @media (max-width: 767px) {
            .clock-center {
                font-size: 12px;
                padding: 2px 10px;
                gap: 5px;
            }
            .clock-center i {
                width: 14px;
                height: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- BACKDROP mobile -->
    <div id="sidebarBackdrop" onclick="toggleSidebar()"></div>

    <!-- ══════ SIDEBAR ══════ -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <div style="display:flex;align-items:center;gap:12px;user-select:none;">
                <div style="width:40px;height:40px;border-radius:14px;background:rgba(139,92,246,0.2);backdrop-filter:blur(8px);border:1px solid rgba(139,92,246,0.25);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(139,92,246,0.2);">
                    <i data-lucide="globe" style="width:18px;height:18px;color:#c4b5fd;"></i>
                </div>
                <div>
                    <div style="font-size:13px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;color:#e2e8f0;line-height:1.2;">Learning Base</div>
                    <div style="font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#f472b6;margin-top:2px;">Hệ sinh thái học tập</div>
                </div>
            </div>
        </div>

        <div style="flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:16px;">
            <div>
                <div class="slabel" style="margin-bottom:10px;">Thư viện cá nhân</div>
                <nav id="appList" style="display:flex;flex-direction:column;gap:4px;"></nav>
            </div>
        </div>

        <div style="padding:12px;border-top:1px solid rgba(255,255,255,0.05);">
            <button class="add-btn" onclick="openAddModal()">
                <i data-lucide="plus" style="width:16px;height:16px;"></i>
                Thêm Ứng Dụng Mới
            </button>
        </div>
    </aside>

    <!-- ══════ MAIN AREA ══════ -->
    <div id="mainArea">

        <!-- HEADER -->
        <div id="headerCard">
            <!-- Bên trái -->
            <div style="display:flex;align-items:center;gap:10px;overflow:hidden;min-width:0;flex:1;">
                <button class="icon-btn" onclick="toggleSidebar()" title="Ẩn/Hiện Cột Trái">
                    <i data-lucide="menu" style="width:16px;height:16px;"></i>
                </button>

                <nav style="display:flex;align-items:center;gap:6px;overflow:hidden;user-select:none;">

                <div class="stat-pill">

    <!-- ══════ MODAL: THÊM ══════ -->
    <div id="addModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(16px);z-index:60;align-items:center;justify-content:center;padding:16px;">
        <div class="modal-card" style="width:100%;max-width:440px;padding:24px;">

    <div id="editModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(16px);z-index:60;align-items:center;justify-content:center;padding:16px;">

            <div style="display:flex;flex-direction:column;gap:16px;">
                <input type="hidden" id="editAppId">
                <div><label class="mlabel">Biểu tượng</label><input class="modal-input" id="editAppEmoji" placeholder="📚  📝  💡"></div>
                <div><label class="mlabel">Tên ứng dụng</label><input class="modal-input" id="editAppName"></div>

            <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.05);">

    <!-- ══════ MODAL: XÓA ══════ -->
    <div id="deleteConfirmModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(16px);z-index:60;align-items:center;justify-content:center;padding:16px;">
        <div class="modal-card" style="width:100%;max-width:360px;padding:28px;text-align:center;">
            <div style="width:56px;height:56px;border-radius:9999px;background:rgba(185,28,28,0.15);border:1px solid rgba(248,113,113,0.15);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
                <i data-lucide="alert-triangle" style="width:24px;height:24px;color:#f87171;"></i>
            </div>
            <h3 style="font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;color:#e2e8f0;margin-bottom:8px;">Xóa Ứng Dụng</h3>
            <p id="deleteConfirmText" style="font-size:12px;color:#94a3b8;line-height:1.5;"></p>
            <div style="display:flex;gap:10px;justify-content:center;margin-top:24px;">
                <button class="btn-sec" onclick="closeDeleteModal()">Hủy</button>
                <button class="btn-danger" id="btnConfirmDelete">Xác Nhận Xóa</button>

    <!-- TOASTS -->
    <div id="toastContainer" style="position:fixed;top:16px;right:16px;z-index:70;display:flex;flex-direction:column;gap:8px;"></div>

    <script>
        let userApps = JSON.parse(localStorage.getItem('my_learning_hub_apps')) || defaultApps;
        let currentActiveAppId = null;
        let dragIndex = null; // lưu index khi kéo

        const quotes = [
            { en: "The beautiful thing about learning is that no one can take it away from you.", vi: "Điều tuyệt vời của việc học là không ai có thể lấy nó đi khỏi bạn.",
                author: "B.B. King" },
            { en: "Success is the sum of small efforts, repeated day in and day out.", vi: "Thành công là tổng của những nỗ lực nhỏ, lặp đi lặp lại mỗi ngày.",
                author: "Robert Collier" },
            { en: "It always seems impossible until it's done.", vi: "Mọi thứ đều có vẻ bất khả thi cho đến khi nó được hoàn thành.",
                author: "Nelson Mandela" },
            { en: "Believe you can and you're halfway there.", vi: "Hãy tin rằng bạn có thể, và bạn đã đi được nửa chặng đường.",
                author: "Theodore Roosevelt" },
            { en: "Live as if you were to die tomorrow. Learn as if you were to live forever.", vi: "Sống như thể bạn sẽ chết vào ngày mai. Học như thể bạn sẽ sống mãi mãi.",
                author: "Mahatma Gandhi" },
            { en: "Education is the passport to the future.", vi: "Giáo dục là tấm hộ chiếu cho tương lai.",
                author: "Malcolm X" },
            { en: "Do not wait for opportunities, create them yourself.", vi: "Đừng chờ đợi cơ hội, hãy tự tạo ra chúng.",
                author: "Chris Grosser" },
        ];

        function updateDate() {
            const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
            const now = new Date();
            const el = document.getElementById('currentDateDisplay');
            if (el) el.textContent =
                `${days[now.getDay()]}, ${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;
        }

        function loadRandomQuote() {
            const q = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById('quoteEn').textContent = `"${q.en}"`;
            document.getElementById('quoteVi').textContent = `(${q.vi})`;
            document.getElementById('quoteAuthor').textContent = `— ${q.author}`;
        }

        function toggleSidebar() {
            if (window.innerWidth >= 768) document.body.classList.toggle('sidebar-collapsed');
            else document.body.classList.toggle('sidebar-open');
        }

        function goHome() {
            loadRandomQuote();
            updateDate();
            document.getElementById('welcomeState').style.display = 'flex';
            document.getElementById('iframeWrapper').style.display = 'none';
            document.getElementById('currentAppName').innerHTML =
                '<span style="font-size:11px;color:#475569;font-style:italic;font-weight:500;">Chưa chọn ứng dụng</span>';
            document.getElementById('activeIndicator').style.display = 'none';
            document.getElementById('appFrame').src = '';
            currentActiveAppId = null;
            document.querySelectorAll('.app-item').forEach(b => b.classList.remove('active'));
        }

        // ===== DRAG & DROP HELPERS =====
        function handleDragStart(e) {
            const item = e.target.closest('.app-item');
            if (!item) return;
            // Nếu người dùng nhấn vào nút sửa/xóa thì không kéo
            if (e.target.closest('.edit-btn') || e.target.closest('.del-btn') || e.target.closest('.app-actions')) {
                e.preventDefault();
                return;
            }
            dragIndex = parseInt(item.dataset.index, 10);
            item.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', dragIndex);
            // Để con trỏ hiển thị rõ ràng
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDragEnd(e) {
            const item = e.target.closest('.app-item');
            if (item) item.classList.remove('dragging');
            document.querySelectorAll('.app-item.drag-over').forEach(el => el.classList.remove('drag-over'));
            dragIndex = null;
        }

        function handleDragOver(e) {
            e.preventDefault(); // cần thiết để cho phép drop
            e.dataTransfer.dropEffect = 'move';
            const target = e.target.closest('.app-item');
            if (target && !target.classList.contains('dragging')) {
                target.classList.add('drag-over');
            }
        }

        function handleDragLeave(e) {
            const target = e.target.closest('.app-item');
            if (target) target.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            const target = e.target.closest('.app-item');
            if (!target) return;
            target.classList.remove('drag-over');

            const dropIdx = parseInt(target.dataset.index, 10);
            if (dragIndex === null || dragIndex === dropIdx) return;

            // Hoán đổi vị trí trong mảng
            const [moved] = userApps.splice(dragIndex, 1);
            userApps.splice(dropIdx, 0, moved);

            // Lưu vào localStorage
            localStorage.setItem('my_learning_hub_apps', JSON.stringify(userApps));

            // Cập nhật lại giao diện
            const activeId = currentActiveAppId;
            renderApps();
            // Khôi phục trạng thái active nếu có
            if (activeId) {
                const activeEl = document.querySelector(`.app-item[data-id="${activeId}"]`);
                if (activeEl) {
                    activeEl.classList.add('active');
                    // Cập nhật lại currentActiveAppId (đã được set trong renderApps)
                    // nhưng renderApps đặt lại currentActiveAppId = null, nên cần đặt lại
                    currentActiveAppId = activeId;
                }
            }

            showToast('✅ Đã sắp xếp lại thứ tự ứng dụng!', 'success');
        }

        // ===== RENDER APPS =====
        function renderApps() {
            const list = document.getElementById('appList');
            list.innerHTML = '';
            userApps.forEach((app, idx) => {
                const btn = document.createElement('div');
                btn.className = 'app-item' + (app.id === currentActiveAppId ? ' active' : '');
                btn.draggable = true;
                btn.dataset.index = idx;
                btn.dataset.id = app.id;

                btn.innerHTML = `
                        <div style="display:flex;align-items:center;gap:8px;overflow:hidden;flex:1;min-width:0;">
                            <span class="drag-handle" style="font-size:12px;">⠿</span>
                            <span style="font-size:20px;flex-shrink:0;line-height:1;user-select:none;">${app.emoji}</span>
                            <div style="overflow:hidden;min-width:0;">
                                <div style="font-size:12px;font-weight:700;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${app.name}</div>
                                <div style="font-size:10px;color:#475569;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;">${app.path}</div>
                            </div>
                        </div>
                        <div class="app-actions">
                            <button class="icon-btn edit-btn" onclick="openEditModal('${app.id}')" title="Sửa" style="padding:5px;border-radius:9px;">
                                <i data-lucide="edit-2" style="width:12px;height:12px;"></i>
                            </button>
                            <button class="icon-btn danger del-btn" onclick="askDeleteApp('${app.id}','${app.name}')" title="Xóa" style="padding:5px;border-radius:9px;">
                                <i data-lucide="trash-2" style="width:12px;height:12px;"></i>
                            </button>
                        </div>`;

                // Gán sự kiện drag
                btn.addEventListener('dragstart', handleDragStart);
                btn.addEventListener('dragend', handleDragEnd);
                btn.addEventListener('dragover', handleDragOver);
                btn.addEventListener('dragleave', handleDragLeave);
                btn.addEventListener('drop', handleDrop);

                // Sự kiện click để mở app (vẫn giữ nguyên)
                btn.addEventListener('click', (e) => {
                    // Nếu click vào nút edit/del hoặc đang kéo thì bỏ qua
                    if (e.target.closest('.edit-btn') || e.target.closest('.del-btn') || e.target.closest(
                            '.app-actions')) return;
                    if (btn.classList.contains('dragging')) return;
                    activateApp(app.id, app.path, btn, app.name, app.emoji);
                });

                list.appendChild(btn);
            });
            document.getElementById('statAppCount').textContent = userApps.length;
            lucide.createIcons();
        }

        function activateApp(id, path, el, name, emoji) {
            currentActiveAppId = id;
            document.querySelectorAll('.app-item').forEach(b => b.classList.remove('active'));
            if (el) el.classList.add('active');

            document.getElementById('currentAppName').innerHTML = `
                    <span class="app-chip">
                        <span style="font-size:14px;flex-shrink:0;line-height:1;user-select:none;">${emoji||'💡'}</span>
                        <span style="font-size:11px;font-weight:700;color:#c4b5fd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${name}</span>
                    </span>`;
            document.getElementById('activeIndicator').style.display = 'inline-flex';

            if (window.innerWidth >= 768) document.body.classList.add('sidebar-collapsed');
            else document.body.classList.remove('sidebar-open');

            document.getElementById('welcomeState').style.display = 'none';
            document.getElementById('iframeWrapper').style.display = 'block';
            document.getElementById('appFrame').src = path;
        }

        /* ── MODALS ── */
        function openAddModal() { const m = document.getElementById('addModal');
            m.style.display = 'flex';
            lucide.createIcons(); }

        function closeAddModal() { document.getElementById('addModal').style.display = 'none';
            ['appEmoji', 'appName', 'appPath'].forEach(id => document.getElementById(id).value = ''); }

        function openEditModal(id) {
            const app = userApps.find(a => a.id === id);
            if (!app) return;
            document.getElementById('editAppId').value = app.id;
            document.getElementById('editAppEmoji').value = app.emoji;
            document.getElementById('editAppName').value = app.name;
            document.getElementById('editAppPath').value = app.path;
            document.getElementById('editModal').style.display = 'flex';
            lucide.createIcons();
        }

        function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }

        function saveEditApp() {
            const id = document.getElementById('editAppId').value;
            const emoji = document.getElementById('editAppEmoji').value.trim() || '💡';
            const name = document.getElementById('editAppName').value.trim();
            const path = document.getElementById('editAppPath').value.trim();
            if (!name || !path) { showToast('Điền đủ thông tin nhé!', 'error'); return; }
            const i = userApps.findIndex(a => a.id === id);
            if (i !== -1) {
                userApps[i] = { ...userApps[i], emoji, name, path };
                localStorage.setItem('my_learning_hub_apps', JSON.stringify(userApps));
                renderApps();
                if (currentActiveAppId === id) {
                    document.getElementById('currentAppName').innerHTML =
                        `<span class="app-chip"><span style="font-size:14px;flex-shrink:0;">${emoji}</span><span style="font-size:11px;font-weight:700;color:#c4b5fd;">${name}</span></span>`;
                    document.getElementById('appFrame').src = path;
                }
                closeEditModal();
                showToast('Đã lưu thay đổi!');
            }
        }

        function askDeleteApp(id, name) {
            document.getElementById('deleteConfirmText').textContent = `Xóa "${name}" khỏi thư viện cá nhân?`;
            document.getElementById('deleteConfirmModal').style.display = 'flex';
            document.getElementById('btnConfirmDelete').onclick = () => {
                userApps = userApps.filter(a => a.id !== id);
                localStorage.setItem('my_learning_hub_apps', JSON.stringify(userApps));
                renderApps();
                document.getElementById('deleteConfirmModal').style.display = 'none';
                showToast('Đã xóa ứng dụng!', 'error');
                goHome();
            };
        }

        function closeDeleteModal() { document.getElementById('deleteConfirmModal').style.display = 'none'; }

        function saveNewApp() {
            const emoji = document.getElementById('appEmoji').value.trim() || '💡';
            const name = document.getElementById('appName').value.trim();
            const path = document.getElementById('appPath').value.trim();
            if (!name || !path) { showToast('Điền đủ thông tin nhé!', 'error'); return; }
            userApps.push({ id: 'app-' + Date.now(), emoji, name, path });
            localStorage.setItem('my_learning_hub_apps', JSON.stringify(userApps));
            renderApps();
            closeAddModal();
            showToast('Đã thêm ứng dụng!');
        }

        function showToast(msg, type = 'success') {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = 'toast';
            t.style.cssText = 'opacity:0;transform:translateY(8px);';
            const col = type === 'error' ? '#f87171' : '#34d399';
            const ico = type === 'error' ? 'alert-triangle' : 'check-circle-2';
            t.innerHTML = `<i data-lucide="${ico}" style="width:16px;height:16px;color:${col};flex-shrink:0;"></i><span>${msg}</span>`;
            c.appendChild(t);
            lucide.createIcons();
            requestAnimationFrame(() => { t.style.transition = 'all 0.3s ease';
                t.style.opacity = '1';
                t.style.transform = 'translateY(0)'; });
            setTimeout(() => { t.style.opacity = '0';
                t.style.transform = 'translateY(-8px)';
                setTimeout(() => t.remove(), 300); }, 3000);
        }

        // ═══ ĐỒNG HỒ ═══
        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
            const el = document.getElementById('clockTime');
            if (el) el.textContent = time;
        }

        window.onload = () => {
            renderApps();
            loadRandomQuote();
            updateDate();
            setInterval(updateDate, 60000);
            updateClock();
            setInterval(updateClock, 1000);
            lucide.createIcons();
        };
    </script>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- 2. Hệ thống đồng bộ tự động 100% cho mọi App con -->
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyDExTCzqNMwKLTHCG92W2HGzKrkXlA_MlM",
        authDomain: "learning-base-5d0a0.firebaseapp.com",
        projectId: "learning-base-5d0a0",
        storageBucket: "learning-base-5d0a0.firebasestorage.app",
        messagingSenderId: "625524211306",
        appId: "1:625524211306:web:ce52abe790b22becb45413",
        measurementId: "G-9MHL89068V"
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
      db.enablePersistence().catch(err => console.warn("Lỗi Offline:", err.code));

      const STORAGE_DOC = db.collection("learning_data").doc("user_progress");
      let currentCloudData = {};

      // Hàm gửi trạng thái lên Firebase
      function syncLessonStatus(key, isChecked) {
        STORAGE_DOC.set({
          [key]: isChecked,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
      }

      // Hàm quét và điền trạng thái checkbox vào iframe hiện tại
      function updateIframeCheckboxes() {
        const iframe = document.getElementById('appFrame');
        if (!iframe || !iframe.contentDocument) return;

        try {
          const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
          const checkboxes = iframeDoc.querySelectorAll('input[type="checkbox"]');

          checkboxes.forEach((cb, index) => {
            // Tự động sinh ID duy nhất cho ô tích nếu chưa có: [ID_App]_[Ví_trí_ô]
            const uniqueKey = cb.id || cb.getAttribute('data-id') || `${currentActiveAppId || 'app'}_cb_${index}`;
            if (!cb.id) cb.id = uniqueKey;

            if (currentCloudData[uniqueKey] !== undefined) {
              cb.checked = currentCloudData[uniqueKey];
            }
          });
        } catch (e) {
          console.warn("Không thể truy cập app trong iframe:", e);
        }
      }

      // Lắng nghe dữ liệu mới nhất từ Cloud
      STORAGE_DOC.onSnapshot((doc) => {
        if (doc.exists) {
          currentCloudData = doc.data();
          updateIframeCheckboxes();
        }
      });

      // TỰ ĐỘNG BẮT SỰ KIỆN: Mỗi khi mở 1 app bất kỳ vào iframe
      const iframeEl = document.getElementById('appFrame');
      iframeEl.addEventListener('load', () => {
        try {
          const iframeDoc = iframeEl.contentDocument || iframeEl.contentWindow.document;

          // Cập nhật tích xanh cho app vừa mở
          updateIframeCheckboxes();

          // Lắng nghe khi bạn bấm tích chọn bài học trong app đó
          iframeDoc.addEventListener('change', (e) => {
            if (e.target.type === 'checkbox') {
              const uniqueKey = e.target.id || e.target.getAttribute('data-id');
              if (uniqueKey) {
                syncLessonStatus(uniqueKey, e.target.checked);
              }
            }
          });
        } catch (e) {
          console.warn("Không thể theo dõi sự kiện iframe:", e);
        }
      });
    </script>
    
</body>
</html>
