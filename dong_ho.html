<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Tối Giản - Clock, Calendar & Time Progress</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: transparent !important;
            color: #18181b;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 3D Container for Flip Cards */
        .flip-unit {
            perspective: 600px;
            background: #202022;
            box-shadow: 0 12px 25px -4px rgba(0, 0, 0, 0.22), 0 6px 10px -4px rgba(0, 0, 0, 0.12);
            border-radius: 16px;
        }

        /* Card Half Sections (Top & Bottom) */
        .card-half {
            position: absolute;
            left: 0;
            right: 0;
            overflow: hidden;
            background: #202022;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .card-top {
            top: 0;
            bottom: 50%;
            border-top-left-radius: inherit;
            border-top-right-radius: inherit;
            align-items: flex-end;
            border-bottom: 1px solid rgba(0, 0, 0, 0.65);
        }

        .card-bottom {
            top: 50%;
            bottom: 0;
            border-bottom-left-radius: inherit;
            border-bottom-right-radius: inherit;
            align-items: flex-start;
        }

        /* Number inner alignment */
        .number-inner {
            position: absolute;
            height: 200%;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            font-weight: 300;
            letter-spacing: -0.02em;
        }

        .card-top .number-inner { top: 0; }
        .card-bottom .number-inner { bottom: 0; }

        /* Split Line Illusion */
        .flip-unit::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1.5px;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
            box-shadow: 0 1px 1px rgba(255, 255, 255, 0.08);
            transform: translateY(-50%);
        }

        /* Colon Separator Dots */
        .colon-dot {
            width: 7px;
            height: 7px;
            background-color: #202022;
            border-radius: 9999px;
            opacity: 0.85;
        }

        /* Flip Animation Cards */
        .leaf {
            position: absolute;
            left: 0;
            right: 0;
            height: 50%;
            z-index: 5;
            perspective: 600px;
            transform-style: preserve-3d;
        }

        .leaf-top {
            top: 0;
            transform-origin: bottom;
            border-top-left-radius: inherit;
            border-top-right-radius: inherit;
        }

        .leaf-bottom {
            top: 50%;
            transform-origin: top;
            border-bottom-left-radius: inherit;
            border-bottom-right-radius: inherit;
        }

        .animate-flip-top { animation: flipTop 0.35s ease-in forwards; }
        .animate-flip-bottom { animation: flipBottom 0.35s ease-out 0.35s forwards; }

        @keyframes flipTop {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(-90deg); }
        }

        @keyframes flipBottom {
            0% { transform: rotateX(90deg); }
            100% { transform: rotateX(0deg); }
        }

        /* Glassmorphism Cards */
        .widget-card {
            background-color: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(32, 32, 34, 0.12);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
        }

        /* Progress Bars */
        .progress-track {
            background-color: rgba(32, 32, 34, 0.08);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill-modern {
            background: linear-gradient(90deg, #202022 0%, #3a3a3e 100%);
            border-radius: 9999px;
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Circular Rings */
        .ring-circle {
            transition: stroke-dashoffset 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center p-4 sm:p-6 lg:p-8">

    <!-- 1 ROW HORIZONTAL DASHBOARD (3 COLUMNS ON DESKTOP) -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 lg:gap-6 w-full max-w-6xl items-stretch">
        
        <!-- COLUMN 1 (LEFT): MINIMALIST CALENDAR -->
        <div class="widget-card rounded-2xl p-5 sm:p-6 text-[#202022] flex flex-col justify-between min-h-[340px]">
            <!-- Calendar Header -->
            <div class="flex items-center justify-between mb-2">
                <button id="prev-month" class="p-1.5 rounded-lg hover:bg-black/5 transition text-base font-bold cursor-pointer">&larr;</button>
                <div id="calendar-month-year" class="font-semibold text-base sm:text-lg tracking-tight">Tháng 1, 2026</div>
                <button id="next-month" class="p-1.5 rounded-lg hover:bg-black/5 transition text-base font-bold cursor-pointer">&rarr;</button>
            </div>

            <!-- Day Names Grid -->
            <div class="grid grid-cols-7 gap-1 text-center font-medium text-[11px] text-zinc-500 my-1">
                <div>T2</div><div>T3</div><div>T4</div><div>T5</div><div>T6</div><div>T7</div><div>CN</div>
            </div>

            <!-- Days Grid -->
            <div id="calendar-days" class="grid grid-cols-7 gap-1 text-center text-xs sm:text-sm font-normal">
                <!-- Injected via JavaScript -->
            </div>

            <!-- Calendar Footer / Today Reset -->
            <div class="mt-3 pt-2.5 border-t border-black/5 flex justify-between items-center text-xs text-zinc-500">
                <span id="current-full-date">Hôm nay</span>
                <button id="btn-today" class="font-medium text-[#202022] hover:underline cursor-pointer">Về hôm nay</button>
            </div>
        </div>

        <!-- COLUMN 2 (CENTER - FOCAL POINT): PURE FLOATING FLIP CLOCK -->
        <div class="flex flex-col items-center justify-center min-h-[340px] p-2">
            <div class="flex items-center justify-center space-x-3 sm:space-x-4 my-auto">
                <!-- HOURS UNIT -->
                <div id="unit-hours" class="flip-unit relative w-24 h-28 sm:w-28 sm:h-34 md:w-32 md:h-36 text-4xl sm:text-5xl md:text-6xl">
                    <div class="card-half card-top"><div class="number-inner static-top">00</div></div>
                    <div class="card-half card-bottom"><div class="number-inner static-bottom">00</div></div>
                    <div class="leaf leaf-top card-half card-top"><div class="number-inner leaf-top-val">00</div></div>
                    <div class="leaf leaf-bottom card-half card-bottom"><div class="number-inner leaf-bottom-val">00</div></div>
                </div>

                <!-- COLON SEPARATOR -->
                <div class="flex flex-col space-y-2.5 sm:space-y-3 px-0.5">
                    <div class="colon-dot"></div>
                    <div class="colon-dot"></div>
                </div>

                <!-- MINUTES UNIT -->
                <div id="unit-minutes" class="flip-unit relative w-24 h-28 sm:w-28 sm:h-34 md:w-32 md:h-36 text-4xl sm:text-5xl md:text-6xl">
                    <div class="card-half card-top"><div class="number-inner static-top">00</div></div>
                    <div class="card-half card-bottom"><div class="number-inner static-bottom">00</div></div>
                    <div class="leaf leaf-top card-half card-top"><div class="number-inner leaf-top-val">00</div></div>
                    <div class="leaf leaf-bottom card-half card-bottom"><div class="number-inner leaf-bottom-val">00</div></div>
                </div>
            </div>
        </div>

        <!-- COLUMN 3 (RIGHT): TIME PROGRESS WIDGET -->
        <div class="widget-card rounded-2xl p-5 sm:p-6 text-[#202022] min-h-[340px] flex flex-col justify-between">
            
            <!-- Header -->
            <div class="border-b border-black/5 pb-2.5">
                <div class="text-[11px] font-bold uppercase tracking-wider text-zinc-500">Tiến Trình Thời Gian</div>
            </div>

            <!-- SLEEK LINEAR PROGRESS BARS -->
            <div id="progress-view-bars" class="space-y-3 py-1 my-auto">
                
                <!-- YEAR PROGRESS -->
                <div class="space-y-1">
                    <div class="flex justify-between items-center text-xs font-medium">
                        <span class="text-zinc-700 font-semibold">Năm <span id="text-year-val">2026</span></span>
                        <span id="label-year" class="font-mono font-bold text-zinc-900">0%</span>
                    </div>
                    <div class="progress-track h-2 w-full">
                        <div id="bar-year" class="progress-fill-modern h-full" style="width: 0%"></div>
                    </div>
                    <div class="flex justify-between text-[10px] text-zinc-400 font-normal">
                        <span id="sub-year-left">Đã qua 0 ngày</span>
                        <span id="sub-year-right">Còn 0 ngày</span>
                    </div>
                </div>

                <!-- MONTH PROGRESS -->
                <div class="space-y-1">
                    <div class="flex justify-between items-center text-xs font-medium">
                        <span class="text-zinc-700 font-semibold">Tháng <span id="text-month-val">1</span></span>
                        <span id="label-month" class="font-mono font-bold text-zinc-900">0%</span>
                    </div>
                    <div class="progress-track h-2 w-full">
                        <div id="bar-month" class="progress-fill-modern h-full" style="width: 0%"></div>
                    </div>
                    <div class="flex justify-between text-[10px] text-zinc-400 font-normal">
                        <span id="sub-month-left">Đã qua 0 ngày</span>
                        <span id="sub-month-right">Còn 0 ngày</span>
                    </div>
                </div>

                <!-- WEEK PROGRESS -->
                <div class="space-y-1">
                    <div class="flex justify-between items-center text-xs font-medium">
                        <span class="text-zinc-700 font-semibold">Tuần Này</span>
                        <span id="label-week" class="font-mono font-bold text-zinc-900">0%</span>
                    </div>
                    <div class="progress-track h-2 w-full">
                        <div id="bar-week" class="progress-fill-modern h-full" style="width: 0%"></div>
                    </div>
                    <div class="flex justify-between text-[10px] text-zinc-400 font-normal">
                        <span id="sub-week-left">Thứ ...</span>
                        <span id="sub-week-right">Còn ... ngày</span>
                    </div>
                </div>

                <!-- DAY PROGRESS -->
                <div class="space-y-1">
                    <div class="flex justify-between items-center text-xs font-medium">
                        <span class="text-zinc-700 font-semibold">Hôm Nay</span>
                        <span id="label-day" class="font-mono font-bold text-zinc-900">0%</span>
                    </div>
                    <div class="progress-track h-2 w-full">
                        <div id="bar-day" class="progress-fill-modern h-full" style="width: 0%"></div>
                    </div>
                    <div class="flex justify-between text-[10px] text-zinc-400 font-normal">
                        <span id="sub-day-left">Đã qua 0 giờ</span>
                        <span id="sub-day-right">Còn 0 giờ</span>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <script>
        // ==========================================
        // 1. FLIP CLOCK LOGIC
        // ==========================================
        const currentValues = {
            'unit-hours': null,
            'unit-minutes': null
        };

        function updateFlipUnit(unitId, newVal, animate = true) {
            if (currentValues[unitId] === newVal) return;

            const unitEl = document.getElementById(unitId);
            if (!unitEl) return;

            const oldVal = currentValues[unitId] || newVal;
            currentValues[unitId] = newVal;

            const staticTop = unitEl.querySelector('.static-top');
            const staticBottom = unitEl.querySelector('.static-bottom');
            const leafTop = unitEl.querySelector('.leaf-top');
            const leafBottom = unitEl.querySelector('.leaf-bottom');
            const leafTopVal = unitEl.querySelector('.leaf-top-val');
            const leafBottomVal = unitEl.querySelector('.leaf-bottom-val');

            if (!animate || oldVal === newVal) {
                staticTop.innerText = newVal;
                staticBottom.innerText = newVal;
                leafTopVal.innerText = newVal;
                leafBottomVal.innerText = newVal;
                return;
            }

            // Setup 3D flip card values
            staticTop.innerText = newVal;
            staticBottom.innerText = oldVal;
            leafTopVal.innerText = oldVal;
            leafBottomVal.innerText = newVal;

            // Reset animation trigger
            leafTop.classList.remove('animate-flip-top');
            leafBottom.classList.remove('animate-flip-bottom');

            // Force reflow for restart animation
            void leafTop.offsetWidth;

            // Apply flip animations
            leafTop.classList.add('animate-flip-top');
            leafBottom.classList.add('animate-flip-bottom');

            // Synchronize static bottom value upon animation completion
            setTimeout(() => {
                staticBottom.innerText = newVal;
                leafTopVal.innerText = newVal;
                leafTop.classList.remove('animate-flip-top');
                leafBottom.classList.remove('animate-flip-bottom');
            }, 700);
        }

        function updateFlipClock(now, animate = true) {
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            updateFlipUnit('unit-hours', hours, animate);
            updateFlipUnit('unit-minutes', minutes, animate);
        }

        // ==========================================
        // 2. TIME PROGRESS BARS LOGIC
        // ==========================================
        function updateTimeProgress(now) {
            const year = now.getFullYear();
            const month = now.getMonth();

            // A. DAY PROGRESS
            const startOfDay = new Date(year, month, now.getDate(), 0, 0, 0, 0);
            const endOfDay = new Date(year, month, now.getDate(), 23, 59, 59, 999);
            const dayPercent = Math.min(100, Math.max(0, ((now - startOfDay) / (endOfDay - startOfDay)) * 100));
            
            const hoursPassed = now.getHours();
            const hoursLeft = 24 - hoursPassed;

            // B. WEEK PROGRESS
            const dayOfWeek = (now.getDay() + 6) % 7; // Monday = 0
            const startOfWeek = new Date(year, month, now.getDate() - dayOfWeek, 0, 0, 0, 0);
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 7);
            const weekPercent = Math.min(100, Math.max(0, ((now - startOfWeek) / (endOfWeek - startOfWeek)) * 100));

            const dayNamesViShort = ["Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6", "Thứ 7", "Chủ Nhật"];

            // C. MONTH PROGRESS
            const startOfMonth = new Date(year, month, 1, 0, 0, 0, 0);
            const endOfMonth = new Date(year, month + 1, 1, 0, 0, 0, 0);
            const monthPercent = Math.min(100, Math.max(0, ((now - startOfMonth) / (endOfMonth - startOfMonth)) * 100));
            
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const monthDayCurrent = now.getDate();
            const monthDaysLeft = daysInMonth - monthDayCurrent;

            // D. YEAR PROGRESS
            const startOfYear = new Date(year, 0, 1, 0, 0, 0, 0);
            const endOfYear = new Date(year + 1, 0, 1, 0, 0, 0, 0);
            const yearPercent = Math.min(100, Math.max(0, ((now - startOfYear) / (endOfYear - startOfYear)) * 100));

            const isLeapYear = (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
            const totalYearDays = isLeapYear ? 366 : 365;
            const yearDayCurrent = Math.floor((now - startOfYear) / (1000 * 60 * 60 * 24)) + 1;
            const yearDaysLeft = totalYearDays - yearDayCurrent;

            // Update Linear Bars
            document.getElementById('text-year-val').innerText = year;
            document.getElementById('bar-year').style.width = yearPercent.toFixed(1) + '%';
            document.getElementById('label-year').innerText = `${yearPercent.toFixed(1)}%`;
            document.getElementById('sub-year-left').innerText = `Đã qua ${yearDayCurrent} ngày`;
            document.getElementById('sub-year-right').innerText = `Còn ${yearDaysLeft} ngày`;

            document.getElementById('text-month-val').innerText = month + 1;
            document.getElementById('bar-month').style.width = monthPercent.toFixed(1) + '%';
            document.getElementById('label-month').innerText = `${monthPercent.toFixed(1)}%`;
            document.getElementById('sub-month-left').innerText = `Đã qua ${monthDayCurrent} ngày`;
            document.getElementById('sub-month-right').innerText = `Còn ${monthDaysLeft} ngày`;

            document.getElementById('bar-week').style.width = weekPercent.toFixed(1) + '%';
            document.getElementById('label-week').innerText = `${weekPercent.toFixed(1)}%`;
            document.getElementById('sub-week-left').innerText = `${dayNamesViShort[dayOfWeek]} (Ngày ${dayOfWeek + 1}/7)`;
            document.getElementById('sub-week-right').innerText = `Còn ${7 - (dayOfWeek + 1)} ngày`;

            document.getElementById('bar-day').style.width = dayPercent.toFixed(1) + '%';
            document.getElementById('label-day').innerText = `${dayPercent.toFixed(1)}%`;
            document.getElementById('sub-day-left').innerText = `Đã qua ${hoursPassed} giờ`;
            document.getElementById('sub-day-right').innerText = `Còn ${hoursLeft} giờ`;
        }

        // ==========================================
        // 3. MINIMALIST CALENDAR LOGIC
        // ==========================================
        let viewDate = new Date();

        function renderCalendar() {
            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();
            const today = new Date();

            // Month Header
            const monthNames = ["Tháng 1", "Tháng 2", "Tháng 3", "Tháng 4", "Tháng 5", "Tháng 6", "Tháng 7", "Tháng 8", "Tháng 9", "Tháng 10", "Tháng 11", "Tháng 12"];
            document.getElementById('calendar-month-year').innerText = `${monthNames[month]}, ${year}`;

            // Footer Full Date string
            const dayNamesVi = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
            document.getElementById('current-full-date').innerText = `${dayNamesVi[today.getDay()]}, ${today.getDate()} ${monthNames[today.getMonth()]}`;

            const daysContainer = document.getElementById('calendar-days');
            daysContainer.innerHTML = '';

            // First day of month & total days
            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7; // Align Mon = 0
            const lastDay = new Date(year, month + 1, 0).getDate();
            const prevLastDay = new Date(year, month, 0).getDate();

            // Previous month padding days
            for (let i = firstDayIndex; i > 0; i--) {
                const dayEl = document.createElement('div');
                dayEl.className = 'py-0.5 text-zinc-300 pointer-events-none';
                dayEl.innerText = prevLastDay - i + 1;
                daysContainer.appendChild(dayEl);
            }

            // Current month days
            for (let d = 1; d <= lastDay; d++) {
                const dayEl = document.createElement('div');
                const isToday = d === today.getDate() && month === today.getMonth() && year === today.getFullYear();

                if (isToday) {
                    dayEl.className = 'py-0.5 my-0.5 bg-[#202022] text-white font-semibold rounded-full shadow-sm flex items-center justify-center';
                } else {
                    dayEl.className = 'py-0.5 my-0.5 rounded-full hover:bg-black/5 transition cursor-default';
                }

                dayEl.innerText = d;
                daysContainer.appendChild(dayEl);
            }

            // Next month padding days to complete grid
            const totalSlots = firstDayIndex + lastDay;
            const remainingSlots = (totalSlots > 35 ? 42 : 35) - totalSlots;
            for (let j = 1; j <= remainingSlots; j++) {
                const dayEl = document.createElement('div');
                dayEl.className = 'py-0.5 text-zinc-300 pointer-events-none';
                dayEl.innerText = j;
                daysContainer.appendChild(dayEl);
            }
        }

        // Calendar Event Listeners
        document.getElementById('prev-month').addEventListener('click', () => {
            viewDate.setMonth(viewDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('next-month').addEventListener('click', () => {
            viewDate.setMonth(viewDate.getMonth() + 1);
            renderCalendar();
        });

        document.getElementById('btn-today').addEventListener('click', () => {
            viewDate = new Date();
            renderCalendar();
        });

        // ==========================================
        // 4. MAIN INIT & REAL-TIME LOOP
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            const initialNow = new Date();
            updateFlipClock(initialNow, false);
            updateTimeProgress(initialNow);
            renderCalendar();

            // Update loop every second
            setInterval(() => {
                const now = new Date();
                updateFlipClock(now, true);
                updateTimeProgress(now);
            }, 1000);
        });
    </script>
</body>
</html>
